services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: battery_type_review
      POSTGRES_USER: battery_type
      POSTGRES_PASSWORD: battery_type_local
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["battery_type_review_pg:/var/lib/postgresql/data"]
  redis:
    image: redis:7
    ports: ["127.0.0.1:56379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: battery_type
      MINIO_ROOT_PASSWORD: battery_type_local
    ports: ["127.0.0.1:59000:9000", "127.0.0.1:59001:9001"]
    volumes: ["battery_type_review_s3:/data"]
volumes:
  battery_type_review_pg:
  battery_type_review_s3:
